<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1075" width="1500" height="1075">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Noto Sans SC', 'Microsoft YaHei', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/></marker>
    <marker id="a-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="a-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="a-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="a-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#334155"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="56" y="52" fill="#f8fafc" font-size="22" font-weight="700">德语：格与形容词词尾 — 谁决定谁</text>
  <text x="56" y="78" fill="#94a3b8" font-size="11">示例：…, denn die Firma hat viel Geld in neue Maschinen investiert.</text>

  <!-- ================= PART A ================= -->
  <rect x="40" y="100" width="1420" height="495" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4" opacity="0.45"/>
  <text x="54" y="122" fill="#22d3ee" font-size="10" font-weight="600">① 句法关系 — 动词是总开关，介词是二道手，名词只供货</text>

  <!-- Sentence -->
  <text x="408" y="158" font-size="19" font-weight="500" xml:space="preserve">
    <tspan fill="#64748b">, denn </tspan><tspan fill="#22d3ee">die Firma</tspan><tspan fill="#64748b"> </tspan><tspan fill="#34d399">hat</tspan><tspan fill="#64748b"> </tspan><tspan fill="#60a5fa">viel Geld</tspan><tspan fill="#64748b"> </tspan><tspan fill="#fb923c">in</tspan><tspan fill="#64748b"> </tspan><tspan fill="#fbbf24">neue</tspan><tspan fill="#64748b"> </tspan><tspan fill="#a78bfa">Maschinen</tspan><tspan fill="#64748b"> </tspan><tspan fill="#34d399">investiert.</tspan>
  </text>

  <!-- Verb box -->
  <rect x="580" y="188" width="340" height="78" rx="8" fill="#0f172a"/>
  <rect x="580" y="188" width="340" height="78" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="750" y="214" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">investieren</text>
  <text x="750" y="232" fill="#94a3b8" font-size="9.5" text-anchor="middle">hat … investiert = 现在完成时</text>
  <text x="750" y="251" fill="#e2e8f0" font-size="10" text-anchor="middle">配价（动词自带的「用法说明书」）</text>

  <!-- Fan arrows from verb -->
  <line x1="640" y1="266" x2="210" y2="341" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#a-cyan)"/>
  <line x1="700" y1="266" x2="500" y2="341" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <line x1="830" y1="266" x2="855" y2="341" stroke="#fb923c" stroke-width="1.6" marker-end="url(#a-orange)"/>

  <rect x="392" y="292" width="56" height="16" rx="3" fill="#0f172a"/>
  <text x="420" y="304" fill="#22d3ee" font-size="8.5" text-anchor="middle">给 第一格</text>
  <rect x="572" y="292" width="56" height="16" rx="3" fill="#0f172a"/>
  <text x="600" y="304" fill="#60a5fa" font-size="8.5" text-anchor="middle">给 第四格</text>
  <rect x="862" y="290" width="88" height="16" rx="3" fill="#0f172a"/>
  <text x="906" y="302" fill="#fb923c" font-size="8.5" text-anchor="middle">选 in ＋ 给第四格</text>

  <!-- Constituent boxes -->
  <rect x="70" y="345" width="250" height="96" rx="8" fill="#0f172a"/>
  <rect x="70" y="345" width="250" height="96" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="195" y="372" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">die Firma</text>
  <text x="195" y="390" fill="#94a3b8" font-size="9" text-anchor="middle">Subjekt · 主语</text>
  <text x="195" y="409" fill="#22d3ee" font-size="10" text-anchor="middle">→ 第一格 Nominativ</text>
  <text x="195" y="428" fill="#64748b" font-size="8.5" text-anchor="middle">die = 定冠词（阴·单）</text>

  <rect x="370" y="345" width="250" height="96" rx="8" fill="#0f172a"/>
  <rect x="370" y="345" width="250" height="96" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="495" y="372" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">viel Geld</text>
  <text x="495" y="390" fill="#94a3b8" font-size="9" text-anchor="middle">Akkusativ-Objekt · 直接宾语</text>
  <text x="495" y="409" fill="#60a5fa" font-size="10" text-anchor="middle">→ 第四格 Akkusativ</text>
  <text x="495" y="428" fill="#64748b" font-size="8.5" text-anchor="middle">viel 无词尾 ＋ 无形容词 = 看不出变化</text>

  <rect x="660" y="345" width="340" height="96" rx="8" fill="#0f172a"/>
  <rect x="660" y="345" width="340" height="96" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="830" y="372" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">in neue Maschinen</text>
  <text x="830" y="390" fill="#94a3b8" font-size="9" text-anchor="middle">介词短语 · 方向 Wohin?</text>
  <text x="830" y="409" fill="#fbbf24" font-size="10" text-anchor="middle">→ in ＋ 第四格（动词锁定）</text>
  <text x="830" y="428" fill="#64748b" font-size="8.5" text-anchor="middle">neue 的 -e 从哪来？见下方 ②</text>

  <!-- Wechselpraeposition note -->
  <rect x="1040" y="345" width="400" height="96" rx="8" fill="#0f172a"/>
  <rect x="1040" y="345" width="400" height="96" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1060" y="369" fill="#fb7185" font-size="10.5" font-weight="600">关键：in / an / auf … 是双向介词</text>
  <text x="1060" y="388" fill="#cbd5e1" font-size="9">它自己不能定格，格必须从外面来：</text>
  <text x="1060" y="406" fill="#cbd5e1" font-size="9">① 动词配价：investieren ＋ in ＋ Akk</text>
  <text x="1060" y="424" fill="#cbd5e1" font-size="9">② 或语义：Wohin? → Akk ／ Wo? → Dat</text>
  <line x1="1000" y1="393" x2="1034" y2="393" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-slate)"/>

  <!-- Warning box -->
  <rect x="70" y="470" width="900" height="110" rx="8" fill="#0f172a"/>
  <rect x="70" y="470" width="900" height="110" rx="8" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1.2"/>
  <text x="90" y="496" fill="#f8fafc" font-size="11" font-weight="600">易错点</text>
  <text x="90" y="520" fill="#cbd5e1" font-size="9.5">不是「形容词看名词的格」。名词本身没有格的信息 —— 它只交出 性 Genus ＋ 数 Numerus。</text>
  <text x="90" y="542" fill="#cbd5e1" font-size="9.5">格由动词（或固定格介词）先定好；形容词再和冠词 / 名词一起，把这个格「标」出来。</text>
  <text x="90" y="566" fill="#fbbf24" font-size="9.5" font-weight="600">一句话：格 ← 动词/介词　性·数 ← 名词　词尾 ← 三者 ＋ 冠词情况查表</text>

  <!-- Comparison box -->
  <rect x="1000" y="470" width="440" height="110" rx="8" fill="#0f172a"/>
  <rect x="1000" y="470" width="440" height="110" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1020" y="496" fill="#a78bfa" font-size="11" font-weight="600">同一个名词，换格 → 换词尾</text>
  <text x="1020" y="520" fill="#cbd5e1" font-size="9">in neu<tspan fill="#fbbf24" font-weight="700">e</tspan> Maschinen → Wohin? → Akk → -e（投到新机器上）</text>
  <text x="1020" y="542" fill="#cbd5e1" font-size="9">in neu<tspan fill="#fbbf24" font-weight="700">en</tspan> Maschinen → Wo? → Dat → -n（在新机器里）</text>
  <text x="1020" y="566" fill="#a78bfa" font-size="9" font-weight="600">→ 词尾跟「格」走，不跟名词走</text>

  <!-- ================= PART B ================= -->
  <rect x="40" y="615" width="1420" height="395" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4" opacity="0.45"/>
  <text x="54" y="638" fill="#a78bfa" font-size="10" font-weight="600">② 词尾生成 — 四步定序</text>
  <text x="54" y="656" fill="#94a3b8" font-size="9">顺序：动词／介词定格  →  名词给性·数  →  冠词定变化类型  →  查表出词尾</text>

  <!-- Connector arrows between stages -->
  <line x1="375" y1="761" x2="399" y2="761" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-slate)"/>
  <line x1="725" y1="761" x2="749" y2="761" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-slate)"/>
  <line x1="1075" y1="761" x2="1099" y2="761" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-slate)"/>

  <!-- Stage 1 -->
  <rect x="55" y="676" width="320" height="170" rx="8" fill="#0f172a"/>
  <rect x="55" y="676" width="320" height="170" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="73" y="706" fill="#34d399" font-size="11.5" font-weight="700">① 动词（Prädikat）定格</text>
  <text x="73" y="736" fill="#cbd5e1" font-size="9.5">investieren 分配：</text>
  <text x="73" y="760" fill="#cbd5e1" font-size="9.5">· 主语 → Nominativ</text>
  <text x="73" y="784" fill="#cbd5e1" font-size="9.5">· 直接宾语 → Akkusativ</text>
  <text x="73" y="808" fill="#cbd5e1" font-size="9.5">· 选介词 ＋ 定它的格</text>
  <text x="73" y="832" fill="#64748b" font-size="8.5">格的第一来源，优先级最高</text>

  <!-- Stage 2 -->
  <rect x="405" y="676" width="320" height="170" rx="8" fill="#0f172a"/>
  <rect x="405" y="676" width="320" height="170" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="423" y="706" fill="#fb923c" font-size="11.5" font-weight="700">② 介词（Präposition）接格</text>
  <text x="423" y="736" fill="#cbd5e1" font-size="9.5">固定格介词 → 它自己定格</text>
  <text x="423" y="758" fill="#94a3b8" font-size="9">  mit/zu/von→Dat · für/ohne→Akk</text>
  <text x="423" y="782" fill="#cbd5e1" font-size="9.5">双向介词 in/an/auf → 不定格</text>
  <text x="423" y="806" fill="#cbd5e1" font-size="9.5">  → 沿用 ① 给的 Akkusativ</text>
  <text x="423" y="832" fill="#64748b" font-size="8.5">本句的 in ＋ Akk 是动词给的</text>

  <!-- Stage 3 -->
  <rect x="755" y="676" width="320" height="170" rx="8" fill="#0f172a"/>
  <rect x="755" y="676" width="320" height="170" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="773" y="706" fill="#a78bfa" font-size="11.5" font-weight="700">③ 名词（Nomen）供货</text>
  <text x="773" y="736" fill="#cbd5e1" font-size="9.5">die Maschine → 阴性 (f.)</text>
  <text x="773" y="760" fill="#cbd5e1" font-size="9.5">→ 复数 Maschinen</text>
  <text x="773" y="784" fill="#fbbf24" font-size="9.5" font-weight="600">名词不决定格！</text>
  <text x="773" y="808" fill="#cbd5e1" font-size="9.5">只交出：性 ＋ 数</text>
  <text x="773" y="832" fill="#64748b" font-size="8.5">格在 ①② 步早已定好</text>

  <!-- Stage 4 -->
  <rect x="1105" y="676" width="320" height="170" rx="8" fill="#0f172a"/>
  <rect x="1105" y="676" width="320" height="170" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1123" y="706" fill="#fbbf24" font-size="11.5" font-weight="700">④ 冠词 → 变化类型</text>
  <text x="1123" y="736" fill="#cbd5e1" font-size="9.5">定冠词后 → 弱变化</text>
  <text x="1123" y="760" fill="#cbd5e1" font-size="9.5">ein-/物主冠词后 → 混合变化</text>
  <text x="1123" y="784" fill="#fbbf24" font-size="9.5" font-weight="600">零冠词 → 强变化 ← 本句</text>
  <text x="1123" y="808" fill="#cbd5e1" font-size="9.5">强 · 复数 · Akk → 词尾 -e</text>
  <text x="1123" y="832" fill="#64748b" font-size="8.5">查表得词尾</text>

  <!-- dashed drops into result bar -->
  <line x1="215" y1="846" x2="215" y2="874" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="565" y1="846" x2="565" y2="874" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="915" y1="846" x2="915" y2="874" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1265" y1="846" x2="1265" y2="874" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>

  <!-- Result bar -->
  <rect x="55" y="880" width="1370" height="105" rx="8" fill="#0f172a"/>
  <rect x="55" y="880" width="1370" height="105" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="80" y="906" fill="#60a5fa" font-size="9" font-weight="600">查表结果</text>
  <text x="80" y="934" fill="#f8fafc" font-size="15" font-weight="600">neue Maschinen ← 强变化 ＋ 复数 ＋ 第四格 → 词尾 <tspan fill="#fbbf24" font-size="19">-e</tspan></text>
  <text x="80" y="962" fill="#94a3b8" font-size="9.5">词尾 = f（ 格 ← ①② 动词/介词　·　性/数 ← ③ 名词　·　变化类型 ← ④ 冠词 ）</text>
  <text x="1400" y="958" fill="#fbbf24" font-size="42" font-weight="700" text-anchor="end">-e</text>

  <!-- Legend -->
  <line x1="56" y1="1038" x2="86" y2="1038" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#a-cyan)"/>
  <text x="94" y="1042" fill="#94a3b8" font-size="9">实线箭头 = 决定 / 分配格</text>
  <line x1="290" y1="1038" x2="320" y2="1038" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a-slate)"/>
  <text x="328" y="1042" fill="#94a3b8" font-size="9">虚线 = 附加信息 / 组合输入</text>
  <text x="560" y="1042" fill="#94a3b8" font-size="9">1 → 2 → 3 → 4 = 决定顺序（先定格 → 再给性数 → 定类型 → 查表）</text>
</svg>